seed: 110

paths:
  expert_csv: wifi_track_data/dacang/track_data/trajs_sliced_513_40x30.csv
  env_img_folder: wifi_track_data/dacang/grid_data/env_imgs/40_30

grid:
  width: 40
  height: 30
  discount: 0.95
  trans_prob: 0.8
  traj_length_bias: 0

medirl:
  layers: [64, 128, 128, 64]
  lr: 0.00005
  weight_decay: 0.25
  n_epochs: 500
  log_tag: benchmark_medirl
  log_dir: run_benchmark

rollout:
  horizon: null
  n_trajs: null

output:
  root: benchmark/outputs
