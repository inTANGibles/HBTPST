seed: 110

paths:
  expert_csv: wifi_track_data/dacang/track_data/trajs_sliced_513_40x30.csv
  env_img_folder: wifi_track_data/dacang/grid_data/env_imgs/40_30

grid:
  width: 40
  height: 30
  discount: 0.95
  trans_prob: 0.8
  traj_length_bias: 0

maxent_irl:
  n_epochs: 30
  lr: 0.05
  vi_demo: true   # set false for full VI loop (slower, same as DMEIRL training)

rollout:
  horizon: null
  n_trajs: null

svf_transport:
  sinkhorn_reg: 0.03
  sinkhorn_iter: 300

output:
  root: benchmark/outputs
